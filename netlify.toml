[build]
  command = "bun run build"
  publish = "dist"

# 301 redirects for retired pages → closest living page (preserves link equity)
[[redirects]]
  from = "/approach"
  to = "/framework"
  status = 301
  force = true

[[redirects]]
  from = "/client-journey"
  to = "/services"
  status = 301
  force = true

[[redirects]]
  from = "/faq"
  to = "/resources"
  status = 301
  force = true

[[redirects]]
  from = "/media"
  to = "/resources"
  status = 301
  force = true

[[redirects]]
  from = "/testimonials"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/workshops"
  to = "/services"
  status = 301
  force = true

# Long-lived immutable caching for hashed build assets (Vite outputs to /assets)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images in /public/images are not content-hashed, so use a moderate
# cache with stale-while-revalidate rather than `immutable`. This still gives
# the Netlify Image CDN a cacheable upstream while allowing same-filename
# replacements to roll out within a day.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
