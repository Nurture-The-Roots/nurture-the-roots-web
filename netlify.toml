[build]
  command = "bun run build"
  publish = "dist"

# 301 redirects for retired pages → closest living page (preserves link equity)
[[redirects]]
  from = "/approach"
  to = "/framework"
  status = 301
  force = true

[[redirects]]
  from = "/client-journey"
  to = "/services"
  status = 301
  force = true

[[redirects]]
  from = "/faq"
  to = "/resources"
  status = 301
  force = true

[[redirects]]
  from = "/media"
  to = "/resources"
  status = 301
  force = true

[[redirects]]
  from = "/testimonials"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/workshops"
  to = "/services"
  status = 301
  force = true

# Long-lived immutable caching for hashed build assets (Vite outputs to /assets)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Long-lived caching for static images served from /public/images
# (also used as the upstream for the Netlify Image CDN)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
